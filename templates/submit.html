{% extends "base.html" %}
{% block title %}AGGIUNGI SCHEDA // ULTRAKILL GUIDE{% endblock %}

{% block content %}
<h2>NUOVA SCHEDA // BOSS O ENEMY</h2>

<form method="POST" action="{{ url_for('submit_entry') }}" class="entry-form">
  <label>Nome</label>
  <input type="text" name="name" required placeholder="Es. Gabriel, Judge of Hell" />

  <label>Categoria</label>
  <select name="category">
    <option value="boss">BOSS</option>
    <option value="enemy">ENEMY</option>
  </select>

  <label>Lore</label>
  <textarea name="lore" rows="3" required></textarea>

  <label>Attack Patterns</label>
  <textarea name="attack_patterns" rows="3" required></textarea>

  <label>Weaknesses</label>
  <textarea name="weaknesses" rows="3" required></textarea>

  <label>Strategies</label>
  <textarea name="strategies" rows="3" required></textarea>

  <button type="submit" class="menu-btn small">SALVA NEL DATABASE</button>
</form>
{% endblock %}
