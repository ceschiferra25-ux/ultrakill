{% extends "base.html" %}
{% block title %}Admin login // ULTRAKILL GUIDE{% endblock %}

{% block content %}
<section class="auth-box">
  <h1>Admin login</h1>
  <p class="section-intro">Admins can add, edit and delete entries and moderate tips.</p>

  {% if error %}<p class="form-summary" role="alert">{{ error }}</p>{% endif %}

  <form method="POST" class="entry-form" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="menu-btn">Log in</button>
  </form>
</section>
{% endblock %}
